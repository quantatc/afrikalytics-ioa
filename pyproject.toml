[project]
name = "insights-tracker"
version = "0.2.0"
description = "Streamlit-first Africa intelligence tracker and enrichment pipeline"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1.0",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "lxml>=5.3.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "openai>=1.99.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "streamlit>=1.35.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = []
